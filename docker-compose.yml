services:
  db:
    image: bitnami/postgresql:latest
    container_name: ${POSTGRES_CONTAINER_NAME:-travel-postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_db}
      POSTGRES_USER: ${POSTGRES_USER:-travel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: travel-backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # These override anything in backend/.env because environment wins over env_file.
      # DATABASE_URL must use 'db' (the compose service name), not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-travel_user}:${POSTGRES_PASSWORD:-travel_password}@db:5432/${POSTGRES_DB:-travel_db}
      SEED_DB_ON_START: ${SEED_DB_ON_START:-false}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_API_BASE_URL: /api
    container_name: travel-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
